version: '3.8'

services:
  # Redis 서비스
  redis:
    image: redis:7-alpine
    container_name: strands-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI 애플리케이션
  api:
    build: .
    container_name: strands-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=your-secret-key-here
      - STRANDS_API_URL=https://api.strands.ai
      - STRANDS_API_KEY=your-strands-api-key
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  redis_data:
