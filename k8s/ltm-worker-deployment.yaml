apiVersion: apps/v1
kind: Deployment
metadata:
  name: ltm-worker
  labels:
    app: ltm-worker
    component: background-worker
    version: "1.0.0"
spec:
  replicas: 2  # 처리량에 따라 조정
  selector:
    matchLabels:
      app: ltm-worker
  template:
    metadata:
      labels:
        app: ltm-worker
        component: background-worker
        version: "1.0.0"
    spec:
      serviceAccountName: ltm-worker-sa
      containers:
      - name: ltm-worker
        image: ltm-worker:latest
        imagePullPolicy: Always
        env:
        - name: AWS_REGION
          value: "ap-northeast-2"
        - name: LTM_QUEUE_URL
          valueFrom:
            configMapKeyRef:
              name: ltm-config
              key: queue-url
        - name: DYNAMODB_HISTORY_TABLE
          valueFrom:
            configMapKeyRef:
              name: ltm-config
              key: history-table-name
        - name: LTM_TABLE_NAME
        - name: LTM_BEDROCK_MODEL_ID
          valueFrom:
            configMapKeyRef:
              name: ltm-config
              key: bedrock-model-id
        - name: LTM_BEDROCK_MAX_TOKENS
          valueFrom:
            configMapKeyRef:
              name: ltm-config
              key: bedrock-max-tokens
        - name: LTM_BEDROCK_TEMPERATURE
          valueFrom:
            configMapKeyRef:
              name: ltm-config
              key: bedrock-temperature
          valueFrom:
            configMapKeyRef:
              name: ltm-config
              key: ltm-table-name
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - /healthcheck.sh
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /healthcheck.sh
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ltm-config
data:
  queue-url: "https://sqs.ap-northeast-2.amazonaws.com/ACCOUNT_ID/strands-agent-ltm-processing-queue-dev"
  history-table-name: "langchain_chat_history"
  ltm-table-name: "strands-agent-user-long-term-memory-dev"
  bedrock-model-id: "anthropic.claude-3-5-sonnet-20241022-v2:0"
  bedrock-max-tokens: "2000"
  bedrock-temperature: "0.3"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ltm-worker-sa
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/strands-agent-ltm-worker-role-dev"

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ltm-worker-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ltm-worker
