<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strands Agent Chat</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --bg-primary: #ffffff;
            --bg-secondary: #f9fafb;
            --border-color: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--primary-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 1000px;
            height: 95vh;
            background: var(--bg-primary);
            border-radius: 24px;
            box-shadow: var(--shadow-xl);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .app-header {
            background: var(--primary-gradient);
            color: white;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-md);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .app-logo {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .app-title {
            font-size: 24px;
            font-weight: 700;
            margin: 0;
        }

        .app-subtitle {
            font-size: 14px;
            opacity: 0.8;
            margin: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success-color);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            background: var(--bg-secondary);
        }

        .login-card {
            background: var(--bg-primary);
            padding: 48px;
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .login-icon {
            width: 80px;
            height: 80px;
            background: var(--primary-gradient);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 36px;
            color: white;
        }

        .login-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s;
            background: var(--bg-primary);
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-select {
            width: 100%;
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 16px;
            background: var(--bg-primary);
            cursor: pointer;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .chat-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-info {
            padding: 16px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: var(--primary-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .user-details h3 {
            font-size: 16px;
            color: var(--text-primary);
            margin: 0;
        }

        .user-details p {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0;
        }

        .chat-actions {
            display: flex;
            gap: 8px;
        }

        .btn-secondary {
            padding: 8px 16px;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: var(--bg-secondary);
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            background: var(--bg-primary);
            scroll-behavior: smooth;
        }

        .message {
            margin-bottom: 24px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: var(--primary-gradient);
            color: white;
        }

        .message.agent .message-avatar {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
        }

        .message-content {
            max-width: 70%;
            padding: 16px 20px;
            border-radius: 20px;
            word-wrap: break-word;
            line-height: 1.5;
            position: relative;
        }

        .message.user .message-content {
            background: var(--primary-gradient);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .message.agent .message-content {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 6px;
        }

        .message-time {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 8px;
        }

        .message.user .message-time {
            text-align: right;
        }

        .chat-input-container {
            padding: 24px;
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
        }

        .chat-input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 16px 20px;
            border: 2px solid var(--border-color);
            border-radius: 24px;
            font-size: 16px;
            resize: none;
            max-height: 120px;
            min-height: 56px;
            transition: all 0.2s;
            background: var(--bg-primary);
        }

        .chat-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-btn {
            width: 56px;
            height: 56px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: var(--shadow-md);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            background: var(--bg-secondary);
            border-radius: 20px;
            border-bottom-left-radius: 6px;
            margin-bottom: 24px;
            max-width: 200px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        .error-message {
            background: #fef2f2;
            color: var(--error-color);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid #fecaca;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .success-message {
            background: #f0fdf4;
            color: var(--success-color);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid #bbf7d0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .app-container {
                height: 100vh;
                border-radius: 0;
            }

            .app-header {
                padding: 16px;
            }

            .app-title {
                font-size: 20px;
            }

            .login-card {
                padding: 32px 24px;
                margin: 20px;
            }

            .chat-messages {
                padding: 16px;
            }

            .message-content {
                max-width: 85%;
            }

            .chat-input-container {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="app-header">
            <div class="header-left">
                <div class="app-logo">
                    <i class="fas fa-robot"></i>
                </div>
                <div>
                    <h1 class="app-title">Strands Agent</h1>
                    <p class="app-subtitle">AI-Powered Conversation Platform</p>
                </div>
            </div>
            <div class="header-right">
                <div class="status-indicator" id="statusIndicator">
                    <div class="status-dot"></div>
                    <span id="statusText">연결 중...</span>
                </div>
            </div>
        </div>

        <div class="main-content">
            <!-- 로그인 화면 -->
            <div class="login-screen" id="loginScreen">
                <div class="login-card">
                    <div class="login-icon">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <h2 class="login-title">환영합니다!</h2>
                    <p class="login-subtitle">사용자 정보를 입력하고 AI 어시스턴트와 대화를 시작하세요</p>
                    
                    <div id="loginError" class="error-message hidden">
                        <i class="fas fa-exclamation-triangle"></i>
                        <span></span>
                    </div>
                    
                    <form id="loginForm">
                        <div class="form-group">
                            <label class="form-label" for="userId">
                                <i class="fas fa-user"></i> 사용자 ID
                            </label>
                            <input 
                                type="text" 
                                id="userId" 
                                class="form-input" 
                                placeholder="예: john.doe@company.com"
                                required
                            >
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="agentSelect">
                                <i class="fas fa-robot"></i> AI 어시스턴트 선택
                            </label>
                            <select id="agentSelect" class="form-select">
                                <option value="assistant-001">🤖 일반 어시스턴트 - 다양한 질문에 답변</option>
                                <option value="support-001">🎧 고객 지원 - 문제 해결 전문</option>
                                <option value="analyst-001">📊 데이터 분석가 - 분석 및 인사이트</option>
                            </select>
                        </div>
                        
                        <button type="submit" class="btn-primary" id="startChatBtn">
                            <i class="fas fa-comments"></i>
                            대화 시작하기
                        </button>
                    </form>
                </div>
            </div>

            <!-- 채팅 화면 -->
            <div class="chat-screen hidden" id="chatScreen">
                <div class="chat-info">
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar"></div>
                        <div class="user-details">
                            <h3 id="userDisplayName"></h3>
                            <p id="agentDisplayName"></p>
                        </div>
                    </div>
                    <div class="chat-actions">
                        <button class="btn-secondary" id="historyBtn">
                            <i class="fas fa-history"></i> 기록
                        </button>
                        <button class="btn-secondary" id="newChatBtn">
                            <i class="fas fa-plus"></i> 새 대화
                        </button>
                        <button class="btn-secondary" id="endSessionBtn">
                            <i class="fas fa-stop-circle"></i> 대화 종료
                        </button>
                        <button class="btn-secondary" id="logoutBtn">
                            <i class="fas fa-sign-out-alt"></i> 로그아웃
                        </button>
                    </div>
                </div>
                
                <div class="chat-messages" id="chatMessages">
                    <!-- 메시지들이 여기에 동적으로 추가됩니다 -->
                </div>
                
                <div class="chat-input-container">
                    <div class="chat-input-wrapper">
                        <textarea 
                            id="messageInput" 
                            class="chat-input" 
                            placeholder="메시지를 입력하세요... (Shift+Enter로 줄바꿈)"
                            rows="1"
                            disabled
                        ></textarea>
                        <button id="sendBtn" class="send-btn" disabled>
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class StrandsAgentApp {
            constructor() {
                console.log('StrandsAgentApp constructor called');
                
                this.apiBase = window.location.origin;
                this.sessionId = null;
                this.userId = null;
                this.currentAgent = 'assistant-001';
                this.isLoggedIn = false;
                
                console.log('App configuration:', {
                    apiBase: this.apiBase,
                    currentAgent: this.currentAgent
                });
                
                try {
                    console.log('Calling initializeElements...');
                    this.initializeElements();
                    
                    console.log('Calling setupEventListeners...');
                    this.setupEventListeners();
                    
                    console.log('Calling initialize...');
                    this.initialize();
                    
                    console.log('Constructor completed successfully');
                } catch (error) {
                    console.error('Error in constructor:', error);
                    throw error;
                }
            }

            initializeElements() {
                console.log('Initializing DOM elements...');
                
                // 로그인 화면 요소들
                this.loginScreen = document.getElementById('loginScreen');
                this.loginForm = document.getElementById('loginForm');
                this.userIdInput = document.getElementById('userId');
                this.agentSelect = document.getElementById('agentSelect');
                this.startChatBtn = document.getElementById('startChatBtn');
                this.loginError = document.getElementById('loginError');
                
                // 로그인 요소들 확인
                console.log('Login elements check:', {
                    loginScreen: !!this.loginScreen,
                    loginForm: !!this.loginForm,
                    userIdInput: !!this.userIdInput,
                    agentSelect: !!this.agentSelect,
                    startChatBtn: !!this.startChatBtn,
                    loginError: !!this.loginError
                });
                
                // 채팅 화면 요소들
                this.chatScreen = document.getElementById('chatScreen');
                this.chatMessages = document.getElementById('chatMessages');
                this.messageInput = document.getElementById('messageInput');
                this.sendBtn = document.getElementById('sendBtn');
                this.userAvatar = document.getElementById('userAvatar');
                this.userDisplayName = document.getElementById('userDisplayName');
                this.agentDisplayName = document.getElementById('agentDisplayName');
                
                // 헤더 요소들
                this.statusText = document.getElementById('statusText');
                this.statusIndicator = document.getElementById('statusIndicator');
                
                // 버튼들
                this.historyBtn = document.getElementById('historyBtn');
                this.newChatBtn = document.getElementById('newChatBtn');
                this.endSessionBtn = document.getElementById('endSessionBtn');
                this.logoutBtn = document.getElementById('logoutBtn');
                
                // 채팅 요소들 확인
                console.log('Chat elements check:', {
                    chatScreen: !!this.chatScreen,
                    chatMessages: !!this.chatMessages,
                    messageInput: !!this.messageInput,
                    sendBtn: !!this.sendBtn
                });
                
                // 필수 요소들이 없으면 에러 표시
                if (!this.loginForm || !this.startChatBtn) {
                    console.error('Critical elements missing!', {
                        loginForm: !!this.loginForm,
                        startChatBtn: !!this.startChatBtn
                    });
                }
                
                console.log('DOM elements initialization completed');
            }

            setupEventListeners() {
                console.log('Setting up event listeners...');
                
                // 로그인 폼 이벤트
                if (this.loginForm) {
                    console.log('Login form found, adding submit listener');
                    this.loginForm.addEventListener('submit', (e) => {
                        console.log('Form submit event triggered');
                        this.handleLogin(e);
                    });
                } else {
                    console.error('Login form not found!');
                }
                
                // 버튼 직접 클릭 이벤트도 추가 (백업)
                if (this.startChatBtn) {
                    console.log('Start chat button found, adding click listener');
                    this.startChatBtn.addEventListener('click', (e) => {
                        console.log('Button click event triggered');
                        // form submit이 아닌 직접 클릭인 경우
                        if (e.target.type !== 'submit') {
                            e.preventDefault();
                            this.handleLogin(e);
                        }
                    });
                } else {
                    console.error('Start chat button not found!');
                }
                
                // 채팅 입력 이벤트
                if (this.sendBtn) {
                    this.sendBtn.addEventListener('click', () => this.sendMessage());
                }
                
                if (this.messageInput) {
                    this.messageInput.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            this.sendMessage();
                        }
                    });
                    
                    // 자동 크기 조절
                    this.messageInput.addEventListener('input', () => this.autoResizeTextarea());
                }
                
                // 버튼 이벤트
                if (this.historyBtn) {
                    this.historyBtn.addEventListener('click', () => this.showHistory());
                }
                if (this.newChatBtn) {
                    this.newChatBtn.addEventListener('click', () => this.startNewChat());
                }
                if (this.endSessionBtn) {
                    this.endSessionBtn.addEventListener('click', () => this.endSession());
                }
                if (this.logoutBtn) {
                    this.logoutBtn.addEventListener('click', () => this.logout());
                }
                
                // 브라우저 종료 시 세션 정리
                this.setupBrowserCloseHandlers();
                
                console.log('Event listeners setup completed');
            }

            async initialize() {
                try {
                    await this.checkSystemHealth();
                    this.loadUserFromStorage();
                    
                    // 브라우저 재시작 시 세션 복구 시도
                    if (this.restoreSessionFromStorage()) {
                        console.log('Session restored, attempting to reconnect...');
                        try {
                            // 세션이 여전히 유효한지 확인
                            const response = await fetch(`${this.apiBase}/sessions/${this.sessionId}`);
                            if (response.ok) {
                                // 세션이 유효하면 채팅 화면으로 전환
                                this.showChatScreen();
                                this.loadChatHistory();
                                this.addMessage('agent', '이전 대화가 복구되었습니다. 계속 대화하실 수 있습니다.');
                            } else {
                                // 세션이 무효하면 정리
                                this.clearSessionFromStorage();
                            }
                        } catch (error) {
                            console.error('Failed to restore session:', error);
                            this.clearSessionFromStorage();
                        }
                    }
                } catch (error) {
                    this.showLoginError('시스템 초기화 실패: ' + error.message);
                }
            }

            async checkSystemHealth() {
                try {
                    const response = await fetch(`${this.apiBase}/health`);
                    const health = await response.json();
                    
                    if (health.status === 'healthy') {
                        this.updateStatus('연결됨', 'success');
                    } else {
                        throw new Error('시스템이 비정상입니다');
                    }
                } catch (error) {
                    this.updateStatus('연결 실패', 'error');
                    throw error;
                }
            }

            updateStatus(text, type = 'success') {
                this.statusText.textContent = text;
                const dot = this.statusIndicator.querySelector('.status-dot');
                dot.style.background = type === 'success' ? 'var(--success-color)' : 'var(--error-color)';
            }

            loadUserFromStorage() {
                const savedUser = localStorage.getItem('strandsUser');
                if (savedUser) {
                    const userData = JSON.parse(savedUser);
                    this.userId = userData.userId;
                    this.currentAgent = userData.agent;
                    this.userIdInput.value = this.userId;
                    this.agentSelect.value = this.currentAgent;
                    this.showChatScreen();
                    this.loadChatHistory();
                }
            }

            saveUserToStorage() {
                localStorage.setItem('strandsUser', JSON.stringify({
                    userId: this.userId,
                    agent: this.currentAgent
                }));
            }

            async handleLogin(e) {
                e.preventDefault();
                
                const userId = this.userIdInput.value.trim();
                const agent = this.agentSelect.value;
                
                console.log('Login attempt:', { userId, agent });
                
                if (!userId) {
                    this.showLoginError('사용자 ID를 입력해주세요.');
                    return;
                }
                
                if (userId.length < 2) {
                    this.showLoginError('사용자 ID는 2자 이상 입력해주세요.');
                    return;
                }
                
                this.startChatBtn.disabled = true;
                this.startChatBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 연결 중...';
                
                try {
                    console.log('Setting user info...');
                    this.userId = userId;
                    this.currentAgent = agent;
                    
                    console.log('Creating new session...');
                    await this.createNewSession();
                    
                    console.log('Session created successfully, session ID:', this.sessionId);
                    
                    console.log('Saving user to storage...');
                    this.saveUserToStorage();
                    
                    console.log('Showing chat screen...');
                    this.showChatScreen();
                    
                    console.log('Loading chat history...');
                    this.loadChatHistory();
                    
                    console.log('Login process completed successfully');
                    
                } catch (error) {
                    console.error('Login error details:', error);
                    console.error('Error stack:', error.stack);
                    
                    let errorMessage = 'Unknown error';
                    if (error.message) {
                        errorMessage = error.message;
                    } else if (typeof error === 'string') {
                        errorMessage = error;
                    }
                    
                    this.showLoginError('로그인 실패: ' + errorMessage);
                } finally {
                    this.startChatBtn.disabled = false;
                    this.startChatBtn.innerHTML = '<i class="fas fa-comments"></i> 대화 시작하기';
                }
            }

            showLoginError(message) {
                this.loginError.querySelector('span').textContent = message;
                this.loginError.classList.remove('hidden');
                setTimeout(() => {
                    this.loginError.classList.add('hidden');
                }, 5000);
            }

            showChatScreen() {
                this.loginScreen.classList.add('hidden');
                this.chatScreen.classList.remove('hidden');
                
                // 사용자 정보 표시
                this.userAvatar.textContent = this.userId.charAt(0).toUpperCase();
                this.userDisplayName.textContent = this.userId;
                this.agentDisplayName.textContent = this.getAgentName();
                
                this.messageInput.disabled = false;
                this.sendBtn.disabled = false;
                this.messageInput.focus();
            }

            getAgentName() {
                const agentNames = {
                    'assistant-001': '🤖 일반 어시스턴트',
                    'support-001': '🎧 고객 지원 전문가',
                    'analyst-001': '📊 데이터 분석가'
                };
                return agentNames[this.currentAgent] || '어시스턴트';
            }

            async createNewSession() {
                console.log('createNewSession called with:', {
                    userId: this.userId,
                    currentAgent: this.currentAgent,
                    apiBase: this.apiBase
                });
                
                try {
                    const requestBody = {
                        user_id: this.userId,
                        agent_id: this.currentAgent,
                        metadata: {
                            source: 'web_chat',
                            agent_type: this.currentAgent,
                            timestamp: new Date().toISOString()
                        }
                    };
                    
                    console.log('Request body:', requestBody);
                    
                    const response = await fetch(`${this.apiBase}/sessions`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(requestBody)
                    });

                    console.log('Response status:', response.status);
                    console.log('Response ok:', response.ok);
                    
                    if (!response.ok) {
                        const errorText = await response.text();
                        console.error('Response error text:', errorText);
                        throw new Error(`세션 생성 실패 (${response.status}): ${errorText}`);
                    }

                    const session = await response.json();
                    console.log('Session response:', session);
                    
                    if (!session.session_id) {
                        throw new Error('세션 ID가 응답에 없습니다');
                    }
                    
                    this.sessionId = session.session_id;
                    console.log('Session ID set to:', this.sessionId);
                    
                } catch (error) {
                    console.error('createNewSession error:', error);
                    
                    if (error.name === 'TypeError' && error.message.includes('fetch')) {
                        throw new Error('서버에 연결할 수 없습니다. 서버가 실행 중인지 확인해주세요.');
                    }
                    
                    throw error;
                }
            }

            async loadChatHistory() {
                if (!this.sessionId) return;
                
                try {
                    const response = await fetch(`${this.apiBase}/sessions/${this.sessionId}/history?limit=20`);
                    if (response.ok) {
                        const history = await response.json();
                        this.displayChatHistory(history.conversation_history || []);
                    }
                } catch (error) {
                    console.warn('대화 기록 로드 실패:', error);
                }
                
                // 환영 메시지 추가
                this.addMessage('agent', `안녕하세요, ${this.userId}님! ${this.getAgentName()}입니다. 무엇을 도와드릴까요?`);
            }

            displayChatHistory(history) {
                this.chatMessages.innerHTML = '';
                history.forEach(entry => {
                    this.addMessage('user', entry.message, entry.timestamp, false);
                    this.addMessage('agent', entry.response, entry.timestamp, false);
                });
            }

            async sendMessage() {
                const message = this.messageInput.value.trim();
                if (!message || !this.sessionId) return;

                this.addMessage('user', message);
                this.messageInput.value = '';
                this.autoResizeTextarea();
                this.disableInput();

                const typingIndicator = this.addTypingIndicator();

                try {
                    const response = await fetch(`${this.apiBase}/sessions/${this.sessionId}/messages`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            session_id: this.sessionId,
                            message: message,
                            message_type: 'user'
                        })
                    });

                    if (!response.ok) {
                        throw new Error('메시지 전송에 실패했습니다');
                    }

                    const result = await response.json();
                    this.removeTypingIndicator(typingIndicator);
                    this.addMessage('agent', result.response);
                } catch (error) {
                    this.removeTypingIndicator(typingIndicator);
                    this.addMessage('agent', '죄송합니다. 오류가 발생했습니다: ' + error.message);
                } finally {
                    this.enableInput();
                }
            }

            addMessage(sender, content, timestamp = null, scroll = true) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}`;
                
                const time = timestamp ? new Date(timestamp) : new Date();
                const timeString = time.toLocaleTimeString('ko-KR', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });

                const avatar = sender === 'user' 
                    ? this.userId.charAt(0).toUpperCase()
                    : '🤖';

                messageDiv.innerHTML = `
                    <div class="message-avatar">${avatar}</div>
                    <div class="message-content">
                        ${content.replace(/\n/g, '<br>')}
                        <div class="message-time">${timeString}</div>
                    </div>
                `;

                this.chatMessages.appendChild(messageDiv);
                if (scroll) this.scrollToBottom();
            }

            addTypingIndicator() {
                const typingDiv = document.createElement('div');
                typingDiv.className = 'typing-indicator';
                typingDiv.innerHTML = `
                    <div class="message-avatar">🤖</div>
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                `;
                this.chatMessages.appendChild(typingDiv);
                this.scrollToBottom();
                return typingDiv;
            }

            removeTypingIndicator(element) {
                if (element && element.parentNode) {
                    element.parentNode.removeChild(element);
                }
            }

            autoResizeTextarea() {
                this.messageInput.style.height = 'auto';
                this.messageInput.style.height = Math.min(this.messageInput.scrollHeight, 120) + 'px';
            }

            enableInput() {
                this.messageInput.disabled = false;
                this.sendBtn.disabled = false;
                this.messageInput.focus();
            }

            disableInput() {
                this.messageInput.disabled = true;
                this.sendBtn.disabled = true;
            }

            scrollToBottom() {
                this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
            }

            async showHistory() {
                try {
                    // 사용자의 세션 목록 조회
                    const sessionsResponse = await fetch(`${this.apiBase}/users/${this.userId}/sessions?limit=10`);
                    if (!sessionsResponse.ok) {
                        throw new Error('세션 목록 조회 실패');
                    }
                    
                    const sessionsData = await sessionsResponse.json();
                    const sessions = sessionsData.sessions || [];
                    
                    if (sessions.length === 0) {
                        this.displayHistoryModal([]);
                        return;
                    }
                    
                    // 모든 세션의 대화 기록 수집
                    const allConversations = [];
                    
                    for (const session of sessions) {
                        try {
                            const historyResponse = await fetch(`${this.apiBase}/sessions/${session.session_id}/history?limit=20`);
                            if (historyResponse.ok) {
                                const historyData = await historyResponse.json();
                                const conversations = historyData.conversation_history || [];
                                
                                // 세션 정보와 함께 대화 기록 추가
                                conversations.forEach(conv => {
                                    allConversations.push({
                                        ...conv,
                                        session_id: session.session_id,
                                        agent_id: session.agent_id,
                                        session_created: session.created_at
                                    });
                                });
                            }
                        } catch (error) {
                            console.warn(`Failed to load history for session ${session.session_id}:`, error);
                        }
                    }
                    
                    // 시간순으로 정렬 (최신순)
                    allConversations.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                    
                    this.displayHistoryModal(allConversations);
                    
                } catch (error) {
                    console.error('History loading error:', error);
                    alert('대화 기록을 불러올 수 없습니다: ' + error.message);
                }
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;

            async startNewChat() {
                try {
                    await this.createNewSession();
                    this.chatMessages.innerHTML = '';
                    
                    // 입력 필드 재활성화
                    if (this.messageInput) {
                        this.messageInput.disabled = false;
                        this.messageInput.placeholder = '메시지를 입력하세요...';
                    }
                    if (this.sendBtn) {
                        this.sendBtn.disabled = false;
                    }
                    
                    // 상태 업데이트
                    this.updateStatus('연결됨', 'success');
                    
                    this.addMessage('agent', `새로운 대화를 시작합니다! 무엇을 도와드릴까요?`);
                } catch (error) {
                    this.addMessage('agent', '새 대화 시작에 실패했습니다: ' + error.message);
                }
            }

            async endSession() {
                if (!this.sessionId) {
                    this.addMessage('agent', '종료할 세션이 없습니다.');
                    return;
                }

                // 사용자에게 확인 요청
                if (!confirm('현재 대화를 종료하시겠습니까? 대화 내용은 자동으로 분석되어 개인화에 활용됩니다.')) {
                    return;
                }

                try {
                    console.log('Ending session:', this.sessionId);
                    
                    const response = await fetch(`${this.apiBase}/sessions/${this.sessionId}`, {
                        method: 'PATCH',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            status: 'ended',
                            reason: 'manual',
                            metadata: {
                                ended_via: 'web_ui',
                                user_agent: navigator.userAgent
                            }
                        })
                    });

                    if (response.ok) {
                        const result = await response.json();
                        console.log('Session ended successfully:', result);
                        
                        // 성공 메시지 표시
                        this.addMessage('agent', '대화가 종료되었습니다. 대화 내용이 분석되어 향후 더 나은 서비스를 제공하는데 활용됩니다.');
                        
                        // 세션 ID 초기화
                        this.sessionId = null;
                        
                        // 입력 비활성화
                        if (this.messageInput) {
                            this.messageInput.disabled = true;
                            this.messageInput.placeholder = '대화가 종료되었습니다. 새 대화를 시작해주세요.';
                        }
                        if (this.sendBtn) {
                            this.sendBtn.disabled = true;
                        }
                        
                        // 상태 업데이트
                        this.updateStatus('대화 종료됨', 'warning');
                        
                    } else {
                        const errorText = await response.text();
                        throw new Error(`세션 종료 실패 (${response.status}): ${errorText}`);
                    }
                    
                } catch (error) {
                    console.error('Failed to end session:', error);
                    this.addMessage('agent', '세션 종료에 실패했습니다: ' + error.message);
                }
            }

            setupBrowserCloseHandlers() {
                // 페이지 언로드 전 세션 정리
                window.addEventListener('beforeunload', (event) => {
                    if (this.sessionId) {
                        console.log('Browser closing, ending session:', this.sessionId);
                        
                        // 동기적으로 세션 종료 요청 (navigator.sendBeacon 사용)
                        const sessionEndData = JSON.stringify({
                            status: 'ended',
                            reason: 'browser_close',
                            metadata: {
                                ended_via: 'browser_close',
                                timestamp: new Date().toISOString()
                            }
                        });
                        
                        // sendBeacon을 사용하여 브라우저 종료 시에도 요청이 전송되도록 함
                        // PATCH 요청을 위한 커스텀 헤더와 함께 전송
                        const formData = new FormData();
                        formData.append('method', 'PATCH');
                        formData.append('data', sessionEndData);
                        
                        const success = navigator.sendBeacon(
                            `${this.apiBase}/sessions/${this.sessionId}`,
                            formData
                        );
                        
                        if (!success) {
                            // sendBeacon이 실패한 경우 동기 fetch 시도
                            try {
                                fetch(`${this.apiBase}/sessions/${this.sessionId}`, {
                                    method: 'PATCH',
                                    keepalive: true,
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    body: sessionEndData
                                });
                            } catch (error) {
                                console.error('Failed to end session on browser close:', error);
                            }
                        }
                        
                        // 로컬 스토리지에서 세션 정보 제거
                        this.clearSessionFromStorage();
                    }
                });

                // 페이지 숨김 시에도 세션 정리 (모바일 브라우저 대응)
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'hidden' && this.sessionId) {
                        console.log('Page hidden, ending session:', this.sessionId);
                        
                        const sessionEndData = JSON.stringify({
                            status: 'ended',
                            reason: 'page_hidden',
                            metadata: {
                                ended_via: 'page_hidden',
                                timestamp: new Date().toISOString()
                            }
                        });
                        
                        // FormData를 사용하여 PATCH 요청 시뮬레이션
                        const formData = new FormData();
                        formData.append('method', 'PATCH');
                        formData.append('data', sessionEndData);
                        
                        navigator.sendBeacon(
                            `${this.apiBase}/sessions/${this.sessionId}`,
                            formData
                        );
                        
                        this.clearSessionFromStorage();
                    }
                });

                // 탭 포커스 잃을 때 (추가 안전장치)
                window.addEventListener('blur', () => {
                    if (this.sessionId) {
                        // 세션 정보를 로컬 스토리지에 저장 (복구용)
                        this.saveSessionToStorage();
                    }
                });

                console.log('Browser close handlers setup completed');
            }

            saveSessionToStorage() {
                if (this.sessionId && this.userId) {
                    const sessionData = {
                        sessionId: this.sessionId,
                        userId: this.userId,
                        currentAgent: this.currentAgent,
                        timestamp: new Date().toISOString()
                    };
                    localStorage.setItem('strandsSession', JSON.stringify(sessionData));
                }
            }

            clearSessionFromStorage() {
                localStorage.removeItem('strandsSession');
                this.sessionId = null;
            }

            restoreSessionFromStorage() {
                try {
                    const sessionData = localStorage.getItem('strandsSession');
                    if (sessionData) {
                        const parsed = JSON.parse(sessionData);
                        const sessionAge = Date.now() - new Date(parsed.timestamp).getTime();
                        
                        // 세션이 1시간 이내인 경우에만 복구
                        if (sessionAge < 60 * 60 * 1000) {
                            this.sessionId = parsed.sessionId;
                            this.userId = parsed.userId;
                            this.currentAgent = parsed.currentAgent;
                            console.log('Session restored from storage:', this.sessionId);
                            return true;
                        } else {
                            // 오래된 세션 데이터 제거
                            this.clearSessionFromStorage();
                        }
                    }
                } catch (error) {
                    console.error('Failed to restore session from storage:', error);
                    this.clearSessionFromStorage();
                }
                return false;
            }

            logout() {
                localStorage.removeItem('strandsUser');
                this.chatScreen.classList.add('hidden');
                this.loginScreen.classList.remove('hidden');
                this.userIdInput.value = '';
                this.chatMessages.innerHTML = '';
                this.sessionId = null;
                this.userId = null;
            }
        }

        // 앱 초기화
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM Content Loaded - Starting app initialization');
            try {
                const app = new StrandsAgentApp();
                console.log('StrandsAgentApp created successfully');
                
                // 전역 변수로 설정 (디버깅용)
                window.strandsApp = app;
                console.log('App instance available as window.strandsApp');
            } catch (error) {
                console.error('Failed to initialize StrandsAgentApp:', error);
                alert('앱 초기화 실패: ' + error.message);
            }
        });
    </script>
</body>
</html>
